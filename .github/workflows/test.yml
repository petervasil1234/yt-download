name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # No yt-dlp or ffmpeg here on purpose: the suite must not depend on the network or on
      # YouTube's current mood. The spawn tests use a stub binary instead.
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
